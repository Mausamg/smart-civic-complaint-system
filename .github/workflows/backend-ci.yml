
name: Backend CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civiccomplaint_test
          POSTGRES_USER: civic_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civic_test_user -d civiccomplaint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CIVIC_TEST_CONNECTION: "Host=localhost;Port=5432;Database=civiccomplaint_test;Username=civic_test_user;Password=ci_test_password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Api/src/CivicComplainSystem.slnx

      - name: Build solution
        run: dotnet build Api/src/CivicComplainSystem.slnx --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test Api/src/CivicComplainSystem.slnx --configuration Release --no-build --verbosity normal

